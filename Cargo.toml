# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-authenticate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-authenticate"
description = "The Xmip authentication gate: verify a presented credential, resolve it to a Party."

[dependencies]
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
xmip-identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
xmip-context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
