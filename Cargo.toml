[package]
name = "xmip-core-authenticate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate"
description = "The Xmip authentication gate: verify a presented credential, resolve it to a Party."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
xcore = { workspace = true }
identify = { workspace = true }
context = { workspace = true }
# X.690: the one reader the estate has, for X.509 here and for the Kerberos
# and LDAP technologies, whose failures this crate's error takes with `From`.
asn1 = { workspace = true }
# Encoding primitives, whose failures this crate's error takes with `From`.
codec = { workspace = true }
# The NTLM message layout, whose failures this crate's error takes with `From`.
ntlm = { workspace = true }

# X.509, shared by `certificate` and `mutual-tls` (ADR-0044) and off unless a
# technology asks for it, so the sixteen that do not never carry a chain
# verifier: webpki walks a chain to a trust anchor, checks validity and a
# CRL, and takes its signature algorithms from ring — the crypto rustls
# already brought into the estate (ADR-0033). `mint` issues certificates
# for tests and ships in no build.
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"], optional = true }
# The DER types webpki takes a chain, anchors and a CRL as.
rustls-pki-types = { version = "1", optional = true }
# A distinguished name and a leaf's fingerprint, read once in the estate
# where a transport that terminates TLS reads them (`tls::Name`,
# `tls::peer::fingerprint`), so the name the gates compare is the name the
# transport wrote; and the estate's one certificate reader
# (`tls::certificate`), which reads the alternative names, a validity and
# the alternative signature's extensions webpki keeps as bytes.
tls = { workspace = true, optional = true }
rcgen = { version = "0.14", optional = true }
time = { version = "0.3", optional = true }
# The alternative, post-quantum signature a hybrid certificate carries
# (ITU-T X.509 (10/2019) clause 9.8) is ML-DSA, which ring does not have and
# aws-lc-rs does; its own feature, so a package is quantum-ready or not.
aws-lc-rs = { version = "1", optional = true, features = ["prebuilt-nasm"] }
# JOSE, whose failures this crate's error takes with `From`. The keys `jwt`
# and `oidc` verify a JWS with are the library's (`jose::jwk`), which those
# two turn on; this crate leaves them off.
jose = { workspace = true }

[features]
x509 = ["dep:webpki", "dep:rustls-pki-types", "dep:tls"]
x509-alt = ["x509", "dep:aws-lc-rs"]
mint = ["x509", "dep:rcgen", "dep:time"]

[dev-dependencies]
# The crate tests its own x509 module: a dev-dependency on itself is how
# Cargo turns a feature on for the tests and for nothing else.
xmip-core-authenticate = { path = ".", features = ["mint", "x509-alt"] }

[lints]
